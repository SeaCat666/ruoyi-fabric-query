# 公司长期访问专用配置：仅允许本机反向代理连接后端。
server:
  address: 127.0.0.1
  port: 8080
  forward-headers-strategy: framework

ruoyi:
  redis:
    enabled: false
  fabric:
    data-init-enabled: false
    accessory-init-enabled: false
    image-init-enabled: false
  inventory:
    data-init-enabled: false

spring:
  datasource:
    druid:
      master:
        # 固定绝对路径，避免从不同工作目录启动时误连另一份 H2 数据库。
        url: jdbc:h2:file:${FABRIC_DB_PATH:D:/ruoyi-fabric-query/ruoyi-admin/data/fabric};MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
      web-stat-filter:
        enabled: false
      stat-view-servlet:
        enabled: false
  devtools:
    restart:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

token:
  # 由 Windows 用户环境变量提供，禁止把生产密钥提交到代码库。
  secret: ${FABRIC_TOKEN_SECRET}
  expireTime: 60

logging:
  level:
    com.ruoyi: info
    org.springframework: warn
